<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="640" height="640" fill="#ffffff"/>
  <rect x="24" y="24" width="592" height="592" rx="14" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/>

  <text x="48" y="60" font-size="20" font-weight="700" fill="#1f2328">SNAPX wiring</text>
  <text x="48" y="80" font-size="12" fill="#6e7781">AI-Thinker ESP32-CAM</text>

  <!-- column headers -->
  <text x="64" y="106" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#6e7781">FROM</text>
  <text x="372" y="106" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#6e7781">ESP32-CAM PIN</text>
  <line x1="48" y1="114" x2="592" y2="114" stroke="#e4e8ec" stroke-width="1"/>
  <line x1="356" y1="98" x2="356" y2="576" stroke="#eef1f3" stroke-width="1"/>

  <!-- section: display -->
  <rect x="48" y="122" width="544" height="24" fill="#f1f0fb"/>
  <rect x="48" y="122" width="4" height="24" fill="#6366f1"/>
  <text x="64" y="138" font-size="11" font-weight="700" letter-spacing="0.6" fill="#4338ca">DISPLAY &#183; ST7735 1.8 in SPI TFT</text>

  <g font-size="13" fill="#1f2328">
    <text x="64" y="169">VCC</text>            <text x="372" y="169" font-family="'Consolas',monospace">3.3V</text>
    <text x="64" y="195">GND</text>            <text x="372" y="195" font-family="'Consolas',monospace">GND</text>
    <text x="64" y="221">CS</text>             <text x="372" y="221" font-family="'Consolas',monospace">GPIO13</text>
    <text x="64" y="247">DC (A0)</text>        <text x="372" y="247" font-family="'Consolas',monospace">GPIO12</text>
    <text x="64" y="273">MOSI (SDA)</text>     <text x="372" y="273" font-family="'Consolas',monospace">GPIO15</text>
    <text x="64" y="299">SCK</text>            <text x="372" y="299" font-family="'Consolas',monospace">GPIO14</text>
    <text x="64" y="325">LED</text>            <text x="372" y="325" font-family="'Consolas',monospace">3.3V</text>
    <text x="64" y="351">RESET</text>          <text x="372" y="351" font-size="12" fill="#6e7781">not wired, TFT_RST = -1</text>
  </g>
  <g stroke="#eef1f3" stroke-width="1">
    <line x1="48" y1="178" x2="592" y2="178"/>
    <line x1="48" y1="204" x2="592" y2="204"/>
    <line x1="48" y1="230" x2="592" y2="230"/>
    <line x1="48" y1="256" x2="592" y2="256"/>
    <line x1="48" y1="282" x2="592" y2="282"/>
    <line x1="48" y1="308" x2="592" y2="308"/>
    <line x1="48" y1="334" x2="592" y2="334"/>
  </g>

  <!-- section: button -->
  <rect x="48" y="372" width="544" height="24" fill="#eafaf3"/>
  <rect x="48" y="372" width="4" height="24" fill="#10b981"/>
  <text x="64" y="388" font-size="11" font-weight="700" letter-spacing="0.6" fill="#047857">SHUTTER BUTTON &#183; 12 mm momentary</text>

  <g font-size="13" fill="#1f2328">
    <text x="64" y="419">Leg 1</text>          <text x="372" y="419" font-family="'Consolas',monospace">GPIO3</text>
    <text x="64" y="445">Leg 2</text>          <text x="372" y="445" font-family="'Consolas',monospace">GND</text>
  </g>
  <line x1="48" y1="428" x2="592" y2="428" stroke="#eef1f3" stroke-width="1"/>
  <text x="64" y="469" font-size="11" fill="#6e7781">Internal pull-up, debounced in firmware, no resistor</text>

  <!-- section: flash -->
  <rect x="48" y="486" width="544" height="24" fill="#fef4e6"/>
  <rect x="48" y="486" width="4" height="24" fill="#f59e0b"/>
  <text x="64" y="502" font-size="11" font-weight="700" letter-spacing="0.6" fill="#b45309">FLASH</text>

  <g font-size="13" fill="#1f2328">
    <text x="64" y="533">Onboard white LED</text>  <text x="372" y="533" font-family="'Consolas',monospace">GPIO4 (PWM)</text>
  </g>

  <line x1="48" y1="558" x2="592" y2="558" stroke="#e4e8ec" stroke-width="1"/>
  <text x="64" y="580" font-size="11" fill="#6e7781">Camera OV2640 uses the fixed AI-Thinker pin map, already wired on the board.</text>
</svg>
